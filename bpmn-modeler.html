<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Herramientas BPMN</title>

  <!-- required modeler styles -->
  <link rel="stylesheet" href="assets/bpmn.css">
  <link rel="stylesheet" href="assets/bpmn-js.css">
  <link rel="stylesheet" href="assets/diagram-js.css">
  <link rel="stylesheet" href="assets/bpmn-font/css/bpmn.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script src="https://unpkg.com/jquery@3.3.1/dist/jquery.js"></script>
  <script src="assets/bpmn-modeler.production.min.js"></script>
  <script src="assets/acciones-diagrama.js"></script>

</head>

<body>
  <div class="app-container">
    <header class="header">
      <div class="header-top">
        <div class="header-left">
          <button class="btn-back" onclick="window.location.href='index.html'">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <h1>Herramientas BPMN 2.0 - Editor de flujos</h1>
        </div>
      </div>


      <nav class="header-menu">
        <div class="dropdown">
          <button class="menu-item dropbtn">
            Archivo <i class="fa-solid fa-caret-down"></i>
          </button>
          <div class="dropdown-content">
            <button id="new-diagram">
              <i class="fa-solid fa-file"></i> Nuevo
            </button>
            <button id="open-button">
              <i class="fa-solid fa-folder-open"></i> Abrir...
            </button>
            <div class="dropdown-divider"></div>
            <button id="save-button">
              <i class="fa-solid fa-floppy-disk"></i> Guardar XML
            </button>
            <button id="export-png-button">
              <i class="fa-solid fa-image"></i> Exportar PNG
            </button>
          </div>
        </div>
      </nav>
    </header>


    <main class="content">
      <div id="canvas"></div>

      <input type="file" id="file-input" accept=".bpmn, .xml" style="display: none;" />

      <div class="zoom-buttons" style="position: absolute; bottom: 60px; right: 20px; z-index: 10;">
        <button id="zoom-in" title="Acercar" style="padding: 8px 12px; margin-right: 5px;">
          <i class="fa-solid fa-magnifying-glass-plus"></i>
        </button>
        <button id="zoom-out" title="Alejar" style="padding: 8px 12px; margin-right: 5px;">
          <i class="fa-solid fa-magnifying-glass-minus"></i>
        </button>
        <button id="zoom-reset" title="Centrar" style="padding: 8px 12px;">
          <i class="fa-solid fa-sync"></i>
        </button>
      </div>
    </main>
  </div>



  <script>
    // modeler instance
    var bpmnInstance = new BpmnJS({ container: '#canvas' });

    createNewDiagram(bpmnInstance);

    $('#new-diagram').click(() => createNewDiagram(bpmnInstance));
    $('#save-button').click(() => exportDiagram(bpmnInstance));

    $('#export-button').click(() => exportSVG(bpmnInstance));
    $('#export-png-button').click(() => exportAsPng(bpmnInstance));
    $('#zoom-in').click(() => adjustZoom(bpmnInstance, 'in'));
    $('#zoom-out').click(() => adjustZoom(bpmnInstance, 'out'));
    $('#zoom-reset').click(() => adjustZoom(bpmnInstance, 'reset'));
    $('#open-button').click(() => $('#file-input').click());
    $('#file-input').change((e) => fileInputOnChange(e, bpmnInstance));

  </script>
  <!--
      Thanks for trying out our BPMN toolkit!

      This example uses the pre-built distribution of the bpmn-js modeler.
      Consider rolling your own distribution to have more flexibility
      regarding which features to include.

      Checkout our advanced examples section to learn more:
      * https://github.com/bpmn-io/bpmn-js-examples#advanced

      To get a bit broader overview over how bpmn-js works,
      follow our walkthrough:
      * https://bpmn.io/toolkit/bpmn-js/walkthrough/

      Related starters:
      * https://raw.githubusercontent.com/bpmn-io/bpmn-js-examples/starter/viewer.html
    -->
</body>

</html>
